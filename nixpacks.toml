[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.install]
cmds = ["python3 -m venv /opt/venv && /opt/venv/bin/pip install -r backend/requirements.txt", "cd frontend && npm install -g pnpm && pnpm install"]

[phases.build]
cmds = ["cd frontend && pnpm run build"]

[start]
cmd = "./run.sh"
