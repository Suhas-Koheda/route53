[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.install]
cmds = ["python3 -m ensurepip --upgrade && python3 -m pip install -r backend/requirements.txt", "cd frontend && npm install -g pnpm && pnpm install"]

[phases.build]
cmds = ["cd frontend && pnpm run build"]

[start]
cmd = "./run.sh"
